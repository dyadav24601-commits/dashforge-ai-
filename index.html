<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DashForge AI</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-4 font-sans">

  <div class="max-w-5xl mx-auto space-y-4">
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-3 bg-zinc-900 p-4 rounded-xl border border-zinc-800">
      <div>
        <h1 class="text-xl font-bold text-indigo-400">DashForge AI</h1>
        <p class="text-xs text-zinc-400">Enterprise Agentic Workspace</p>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <input id="apiKey" type="password" placeholder="Paste Gemini API Key..." class="bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-1.5 text-sm w-full sm:w-60 outline-none focus:border-indigo-500" />
        <span id="status" class="text-xs px-2.5 py-1.5 rounded-lg bg-zinc-950 border border-zinc-800 text-red-400">● Offline</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <input id="csvFile" type="file" accept=".csv" class="text-xs text-zinc-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white cursor-pointer" />
        <button id="resetBtn" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-lg">Reset</button>
      </div>

      <textarea id="prompt" rows="3" placeholder="Describe your dashboard (e.g., Monthly sales dashboard with charts)..." class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-sm outline-none focus:border-indigo-500"></textarea>

      <div class="flex flex-wrap gap-2">
        <button id="genBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2 px-4 rounded-lg text-sm font-semibold">Generate / Refine</button>
        <button id="fixBtn" class="bg-zinc-800 hover:bg-zinc-700 py-2 px-3 rounded-lg text-xs text-amber-300">Auto-Fix</button>
        <button id="exportBtn" class="bg-zinc-800 hover:bg-zinc-700 py-2 px-3 rounded-lg text-xs">Export HTML</button>
      </div>

      <p id="log" class="text-xs text-zinc-400">Paste your API key and describe a dashboard to start.</p>
    </div>

    <!-- Tabs & Output -->
    <div class="bg-zinc-900 rounded-xl border border-zinc-800 overflow-hidden">
      <div class="flex gap-2 p-2 bg-zinc-950 border-b border-zinc-800">
        <button id="viewPreview" class="px-3 py-1 rounded text-xs font-semibold bg-indigo-600">Live Preview</button>
        <button id="viewCode" class="px-3 py-1 rounded text-xs font-semibold bg-zinc-800">Code View</button>
        <button id="applyBtn" class="hidden px-3 py-1 rounded text-xs font-semibold bg-emerald-600 ml-auto">Apply Code</button>
      </div>
      <iframe id="preview" class="w-full h-[500px] bg-white border-0"></iframe>
      <textarea id="codeBox" class="hidden w-full h-[500px] bg-zinc-950 text-emerald-400 font-mono text-xs p-3 outline-none"></textarea>
    </div>
  </div>

  <script>
    const apiKey = document.getElementById('apiKey');
    const status = document.getElementById('status');
    const csvFile = document.getElementById('csvFile');
    const prompt = document.getElementById('prompt');
    const genBtn = document.getElementById('genBtn');
    const fixBtn = document.getElementById('fixBtn');
    const resetBtn = document.getElementById('resetBtn');
    const exportBtn = document.getElementById('exportBtn');
    const viewPreview = document.getElementById('viewPreview');
    const viewCode = document.getElementById('viewCode');
    const applyBtn = document.getElementById('applyBtn');
    const preview = document.getElementById('preview');
    const codeBox = document.getElementById('codeBox');
    const log = document.getElementById('log');

    let csvText = '', htmlCode = '';

    if (localStorage.getItem('df_key')) {
      apiKey.value = localStorage.getItem('df_key');
      checkKey(apiKey.value);
    }

    function checkKey(k) {
      if (k.trim().length > 20) {
        status.textContent = '● Online';
        status.className = 'text-xs px-2.5 py-1.5 rounded-lg bg-zinc-950 border border-zinc-800 text-emerald-400';
        localStorage.setItem('df_key', k.trim());
      } else {
        status.textContent = '● Offline';
        status.className = 'text-xs px-2.5 py-1.5 rounded-lg bg-zinc-950 border border-zinc-800 text-red-400';
      }
    }

    apiKey.oninput = e => checkKey(e.target.value);

    csvFile.onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => { csvText = ev.target.result.slice(0, 12000); log.textContent = 'CSV Loaded: ' + f.name; };
      r.readAsText(f);
    };

    viewPreview.onclick = () => {
      preview.classList.remove('hidden'); codeBox.classList.add('hidden'); applyBtn.classList.add('hidden');
      viewPreview.className = 'px-3 py-1 rounded text-xs font-semibold bg-indigo-600';
      viewCode.className = 'px-3 py-1 rounded text-xs font-semibold bg-zinc-800';
    };

    viewCode.onclick = () => {
      preview.classList.add('hidden'); codeBox.classList.remove('hidden'); applyBtn.classList.remove('hidden');
      viewCode.className = 'px-3 py-1 rounded text-xs font-semibold bg-indigo-600';
      viewPreview.className = 'px-3 py-1 rounded text-xs font-semibold bg-zinc-800';
    };

    applyBtn.onclick = () => { htmlCode = codeBox.value; preview.srcdoc = htmlCode; viewPreview.click(); };

    resetBtn.onclick = () => {
      prompt.value = ''; csvText = ''; htmlCode = ''; preview.srcdoc = ''; codeBox.value = '';
      log.textContent = 'Workspace reset.';
    };

    exportBtn.onclick = () => {
      if (!htmlCode) return alert('Generate a dashboard first!');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([htmlCode], { type: 'text/html' }));
      a.download = 'dashboard.html'; a.click();
    };

    async function runAI(isFix = false) {
      const key = apiKey.value.trim();
      if (!key) return alert('Please paste your Gemini API Key first!');
      if (!prompt.value.trim() && !isFix) return alert('Please describe your dashboard!');

      genBtn.disabled = true; genBtn.textContent = 'Generating...'; log.textContent = 'AI is building your dashboard...';

      const sys = 'Return ONLY raw single-file HTML starting with <!DOCTYPE html> and ending with </html>. No markdown backticks. Use Tailwind CSS CDN and Chart.js CDN to build a modern dark-themed interactive dashboard with KPI cards and charts.';
      const msg = isFix ? `Fix errors in this HTML:\n${htmlCode}` :
        (htmlCode ? `Update this dashboard: ${prompt.value}\nCSV:\n${csvText}\nHTML:\n${htmlCode}` :
        `Create a dashboard: ${prompt.value}\n${csvText ? 'CSV Data:\n' + csvText : ''}`);

      try {
        const res = await fetch(`https://googleapis.com{key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: sys }] },
            contents: [{ parts: [{ text: msg }] }]
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'API Error');
        let code = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        code = code.replace(/^```html\s*/i, '').replace(/```\s*$/i, '').trim();
        htmlCode = code; preview.srcdoc = code; codeBox.value = code; viewPreview.click();
        log.textContent = '✅ Dashboard Ready!';
      } catch (e) {
        log.textContent = '❌ Error: ' + e.message;
      } finally {
        genBtn.disabled = false; genBtn.textContent = 'Generate / Refine';
      }
    }

    genBtn.onclick = () => runAI(false);
    fixBtn.onclick = () => htmlCode ? runAI(true) : alert('Nothing to fix yet!');
  </script>
</body>
</html>
