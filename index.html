<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DashForge AI - Fast Workspace</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 14px; }
    .container { max-width: 960px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 1.4rem; color: #38bdf8; }
    .badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 99px; background: #1e293b; color: #4ade80; border: 1px solid #334155; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    input[type="password"], select, textarea {
      width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #475569;
      border-radius: 8px; padding: 10px 12px; font-size: 0.95rem;
    }
    .key-box { flex: 2; min-width: 200px; }
    .model-box { flex: 1; min-width: 170px; }
    textarea { min-height: 85px; resize: vertical; margin-bottom: 10px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      background: #2563eb; color: #fff; border: none; border-radius: 8px;
      padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 0.92rem;
    }
    button:hover { background: #1d4ed8; }
    button.sec { background: #334155; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .err { background: #450a0a; border: 1px solid #ef4444; color: #fecaca; padding: 10px; border-radius: 8px; margin-bottom: 12px; display: none; font-size: 0.9rem; }
    .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
    .tab { flex: 1; background: #334155; text-align: center; }
    .tab.active { background: #2563eb; }
    iframe { width: 100%; height: 520px; border: none; border-radius: 8px; background: #ffffff; }
    pre { background: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 0.82rem; max-height: 520px; margin: 0; display: none; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>DashForge AI</h1>
      <span class="badge" id="statusBadge">● Ready</span>
    </div>

    <div class="card">
      <div class="row">
        <input type="password" id="apiKey" class="key-box" placeholder="Paste API Key (AIza... / gsk_... / sk-...)" oninput="autoSelectModel()" />
        <select id="modelSelect" class="model-box">
          <option value="gemini">Gemini Auto-Flash (Fast)</option>
          <option value="groq">Groq Llama 3.3 70B (3s)</option>
          <option value="openai">OpenAI GPT-4o Mini</option>
        </select>
      </div>
      <textarea id="prompt" placeholder="Describe your dashboard or app (e.g., Create an Indian monthly sales dashboard in ₹ with charts)..."></textarea>
      <div class="btn-row">
        <button id="genBtn" onclick="generateApp()">Generate / Refine</button>
        <button class="sec" onclick="exportHTML()">Export HTML</button>
        <button class="sec" onclick="resetAll()">Reset</button>
      </div>
    </div>

    <div class="err" id="errorBox"></div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" id="tabPreview" onclick="switchTab('preview')">Live Preview</button>
        <button class="tab" id="tabCode" onclick="switchTab('code')">Code View</button>
      </div>
      <iframe id="previewFrame"></iframe>
      <pre id="codeView"></pre>
    </div>
  </div>

  <script>
    let currentCode = "";
    const keyInput = document.getElementById("apiKey");
    const modelSelect = document.getElementById("modelSelect");

    window.onload = () => {
      const savedKey = localStorage.getItem("df_key");
      const savedModel = localStorage.getItem("df_model");
      if (savedKey) keyInput.value = savedKey;
      if (savedModel) modelSelect.value = savedModel;
    };

    function autoSelectModel() {
      const k = keyInput.value.trim();
      if (k.startsWith("AIza")) modelSelect.value = "gemini";
      else if (k.startsWith("gsk_")) modelSelect.value = "groq";
      else if (k.startsWith("sk-")) modelSelect.value = "openai";
      localStorage.setItem("df_key", k);
      localStorage.setItem("df_model", modelSelect.value);
    }

    function switchTab(t) {
      document.getElementById("tabPreview").classList.toggle("active", t === "preview");
      document.getElementById("tabCode").classList.toggle("active", t === "code");
      document.getElementById("previewFrame").style.display = t === "preview" ? "block" : "none";
      document.getElementById("codeView").style.display = t === "code" ? "block" : "none";
    }

    async function getActiveGeminiModel(key) {
      const listRes = await fetch("https://googleapis.com" + encodeURIComponent(key));
      if (!listRes.ok) return "models/gemini-2.5-flash";
      const listData = await listRes.json();
      const models = (listData.models || []).filter(m =>
        (m.supportedGenerationMethods || []).includes("generateContent")
      );
      const flash = models.find(m => m.name.includes("flash") && !m.name.includes("1.5") && !m.name.includes("2.0"));
      const chosen = flash || models.at(0);
      return chosen ? chosen.name : "models/gemini-2.5-flash";
    }

    async function generateApp() {
      const key = keyInput.value.trim();
      const userPrompt = document.getElementById("prompt").value.trim();
      const provider = modelSelect.value;
      const errBox = document.getElementById("errorBox");
      const btn = document.getElementById("genBtn");
      const badge = document.getElementById("statusBadge");

      errBox.style.display = "none";
      if (!key) { showError("कृपया ऊपर अपनी API Key पेस्ट करें।"); return; }
      if (!userPrompt) { showError("कृपया नीचे लिखें कि आपको क्या बनाना है।"); return; }

      localStorage.setItem("df_key", key);
      localStorage.setItem("df_model", provider);

      btn.disabled = true;
      btn.innerText = "Generating...";
      badge.innerText = "● Building...";

      const sysInstruction = "You are an expert frontend developer. Return ONLY a complete, single-file HTML document using Tailwind CSS CDN and Chart.js CDN. Make it 100% mobile-responsive, modern, interactive, with realistic data. Do NOT include any markdown backticks or explanations—output raw HTML only.";
      const finalPrompt = currentCode
        ? "Update this existing HTML code based on the request: " + userPrompt + "\n\nExisting HTML:\n" + currentCode
        : userPrompt;

      try {
        let htmlOutput = "";

        if (provider === "gemini") {
          const modelPath = await getActiveGeminiModel(key);
          const url = "https://googleapis.com" + modelPath + ":generateContent?key=" + encodeURIComponent(key);
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: sysInstruction }] },
              contents: [{ parts: [{ text: finalPrompt }] }]
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || "HTTP " + res.status);
          htmlOutput = data.candidates?.at(0)?.content?.parts?.at(0)?.text || "";
        } else {
          const url = provider === "groq"
            ? "https://groq.com"
            : "https://openai.com";
          const modelName = provider === "groq" ? "llama-3.3-70b-versatile" : "gpt-4o-mini";
          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + key
            },
            body: JSON.stringify({
              model: modelName,
              messages: [
                { role: "system", content: sysInstruction },
                { role: "user", content: finalPrompt }
              ]
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || "HTTP " + res.status);
          htmlOutput = data.choices?.at(0)?.message?.content || "";
        }

        htmlOutput = htmlOutput.replace(/^```html\s*/i, "").replace(/```$/i, "").trim();
        currentCode = htmlOutput;
        document.getElementById("previewFrame").srcdoc = currentCode;
        document.getElementById("codeView").textContent = currentCode;
        badge.innerText = "● Live Ready";
      } catch (e) {
        showError("Error: " + e.message);
        badge.innerText = "● Error";
      } finally {
        btn.disabled = false;
        btn.innerText = "Generate / Refine";
      }
    }

    function showError(msg) {
      const errBox = document.getElementById("errorBox");
      errBox.innerText = "❌ " + msg;
      errBox.style.display = "block";
    }

    function exportHTML() {
      if (!currentCode) { showError("पहले कोई डैशबोर्ड जेनरेट करें।"); return; }
      const blob = new Blob([currentCode], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "dashforge-dashboard.html";
      a.click();
    }

    function resetAll() {
      currentCode = "";
      document.getElementById("prompt").value = "";
      document.getElementById("previewFrame").srcdoc = "";
      document.getElementById("codeView").textContent = "";
      document.getElementById("errorBox").style.display = "none";
    }
  </script>
</body>
</html>
