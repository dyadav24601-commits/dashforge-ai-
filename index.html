<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DashForge AI - Enterprise Agentic Workspace</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; color: #38bdf8; }
    p.sub { margin: 0 0 16px; color: #94a3b8; font-size: 0.95rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    input[type="password"], textarea {
      width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #475569;
      border-radius: 8px; padding: 10px 12px; font-size: 0.95rem;
    }
    input[type="password"] { flex: 1; min-width: 200px; }
    textarea { min-height: 90px; resize: vertical; margin-bottom: 12px; }
    .status { font-weight: 600; font-size: 0.9rem; padding: 6px 12px; border-radius: 20px; background: #0f172a; }
    .online { color: #4ade80; }
    .offline { color: #f87171; }
    button {
      background: #2563eb; color: white; border: none; padding: 10px 16px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
    }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button.danger { background: #dc2626; }
    #errorBox {
      display: none; background: #450a0a; border: 1px solid #ef4444; color: #fca5a5;
      padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
    iframe { width: 100%; height: 480px; border: 1px solid #334155; border-radius: 8px; background: #ffffff; }
    #codeEditor { display: none; min-height: 480px; font-family: monospace; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>DashForge AI</h1>
    <p class="sub">Enterprise Agentic Workspace</p>

    <div class="card">
      <div class="row">
        <input type="password" id="apiKey" placeholder="Paste Gemini API Key (AIzaSy...)..." oninput="checkKey()" />
        <span id="statusBadge" class="status offline">● Offline</span>
        <button class="secondary" onclick="resetAll()">Reset</button>
      </div>

      <textarea id="promptInput" placeholder="Describe your dashboard (e.g., Create a monthly sales dashboard with charts)..."></textarea>

      <div class="row" style="margin-bottom: 0;">
        <button id="genBtn" onclick="generateDashboard()">Generate / Refine</button>
        <button class="secondary" onclick="exportHTML()">Export HTML</button>
      </div>
    </div>

    <div id="errorBox"></div>

    <div class="card">
      <div class="tabs">
        <button id="previewTab" onclick="showTab('preview')">Live Preview</button>
        <button id="codeTab" class="secondary" onclick="showTab('code')">Code View</button>
        <button class="secondary" onclick="applyEditedCode()">Apply Code</button>
      </div>
      <iframe id="previewFrame"></iframe>
      <textarea id="codeEditor"></textarea>
    </div>
  </div>

  <script>
    let currentCode = "";

    function checkKey() {
      const key = document.getElementById("apiKey").value.trim();
      const badge = document.getElementById("statusBadge");
      if (key.length > 20) {
        badge.textContent = "● Online";
        badge.className = "status online";
      } else {
        badge.textContent = "● Offline";
        badge.className = "status offline";
      }
    }

    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.style.display = msg ? "block" : "none";
      box.textContent = msg ? "❌ " + msg : "";
    }

    function showTab(tab) {
      const frame = document.getElementById("previewFrame");
      const editor = document.getElementById("codeEditor");
      if (tab === "preview") {
        frame.style.display = "block";
        editor.style.display = "none";
      } else {
        frame.style.display = "none";
        editor.style.display = "block";
        editor.value = currentCode;
      }
    }

    function applyEditedCode() {
      currentCode = document.getElementById("codeEditor").value;
      document.getElementById("previewFrame").srcdoc = currentCode;
      showTab("preview");
    }

    function resetAll() {
      document.getElementById("promptInput").value = "";
      currentCode = "";
      document.getElementById("previewFrame").srcdoc = "";
      document.getElementById("codeEditor").value = "";
      showError("");
    }

    function exportHTML() {
      if (!currentCode) return alert("पहले डैशबोर्ड Generate करें!");
      const blob = new Blob([currentCode], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "dashboard.html";
      a.click();
    }

    async function generateDashboard() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const prompt = document.getElementById("promptInput").value.trim();
      const btn = document.getElementById("genBtn");

      if (!apiKey) return showError("कृपया पहले अपनी Gemini API Key पेस्ट करें।");
      if (!prompt) return showError("कृपया डैशबोर्ड के बारे में कुछ लिखें।");

      showError("");
      btn.disabled = true;
      btn.textContent = "Generating...";

      const systemPrompt = `You are an expert frontend developer. Create a complete, single-file responsive HTML dashboard with embedded CSS and Chart.js (from https://jsdelivr.net) if charts are needed. Return ONLY raw valid HTML code starting with <!DOCTYPE html>. Do not wrap in markdown backticks. User request: ${prompt}` + (currentCode ? `\n\nExisting HTML to refine:\n${currentCode}` : "");

      try {
        const response = await fetch(`https://googleapis.com{encodeURIComponent(apiKey)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: systemPrompt }] }]
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "API Request Failed (" + response.status + ")");
        }

        let html = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        html = html.replace(/^```html\s*/i, "").replace(/```\s*$/i, "").trim();

        currentCode = html;
        document.getElementById("previewFrame").srcdoc = currentCode;
        document.getElementById("codeEditor").value = currentCode;
        showTab("preview");
      } catch (err) {
        showError(err.message + " (इंटरनेट, VPN या API Key की जांच करें)");
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate / Refine";
      }
    }
  </script>
</body>
</html>
